<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch trình">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Lịch trình</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#12151C;--muted:#6B7385;--line:rgba(18,21,28,.09);--accent:#3556E8;--tint:#E8ECFF;--ok:#23864F;--ok-bg:#DDF2E5;--todo:#6B7385;--todo-bg:#E7EAF0;--late:#C23B2B;--late-bg:#FBE5E1;--bar:rgba(255,255,255,.82);
--shadow:0 1px 2px rgba(18,21,28,.04),0 8px 20px rgba(18,21,28,.06);--ease:cubic-bezier(.22,.8,.24,1);--tab-h:62px}
@media(prefers-color-scheme:dark){:root{--bg:#0E1116;--surface:#181C24;--ink:#F1F3F8;--muted:#9AA3B5;--line:rgba(255,255,255,.1);--accent:#7B93FF;--tint:#232C4D;--ok:#6FD39A;--ok-bg:#16301F;--todo:#A3AFC0;--todo-bg:#232E3B;--late:#F0917F;--late-bg:#3A1E19;--bar:rgba(24,28,36,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{color:var(--muted);font-size:13px}
.g{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:500px){.app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.12)}}
.page{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 76px) 20px calc(var(--tab-h) + env(safe-area-inset-bottom) + 100px);opacity:0;visibility:hidden;transition:opacity .28s var(--ease),transform .34s var(--ease),visibility 0s .34s}
.page.on{opacity:1;visibility:visible;transition-delay:0s}
.title{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:8px 0 12px}
.nv{display:flex;gap:8px;margin:0 0 16px}
.nb{display:grid;place-items:center;min-width:40px;height:36px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);color:var(--accent);font-size:14px;font-weight:600;transition:transform .18s var(--ease)}
.nb .g{width:18px;height:18px}.nb:active{transform:scale(.94)}
.range{margin:-6px 0 14px;color:var(--muted)}
.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px}.sec small{margin-left:8px;font-weight:500}
.cal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:10px 8px 6px}
.wk,.days,.strip{display:grid;grid-template-columns:repeat(7,1fr)}
.wk span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0 6px}
.dy,.sd{display:grid;justify-items:center;align-content:center;gap:3px;border-radius:14px;transition:background .2s var(--ease)}
.dy{height:54px}.dy b,.sd b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:600;transition:background .2s var(--ease),color .2s}
.dy.out{opacity:.38}.dy.today b,.sd.today b{color:var(--accent)}
.dy.sel b,.sd.sel b{background:var(--accent);color:#fff}
.dy:active,.sd:active{background:var(--tint)}
.dots{display:flex;gap:3px;height:6px}.dots u{width:5px;height:5px;border-radius:50%;background:var(--todo)}
.dots .dt-doing{background:var(--accent)}.dots .dt-done{background:var(--ok)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:12px 0 0;font-size:13px;color:var(--muted)}
.lgd span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--todo)}
.lgd .l2::before{background:var(--accent)}.lgd .l3::before{background:var(--ok)}
.strip{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:8px 6px;margin-bottom:6px}
.sd{padding:6px 0 4px}.sd small{font-weight:600}
.day{margin-top:20px}.day h3{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--muted)}.day h3 small{margin-left:8px;font-weight:500}
.day.sel h3{color:var(--accent)}
.stack{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.item:active{transform:scale(.97);box-shadow:0 1px 2px rgba(18,21,28,.06)}
.tm2{display:grid;gap:1px;min-width:48px}.tm2 b{font-size:15px}.tm2 small{font-size:12px}
.bd{flex:1;min-width:0;display:grid;gap:2px}.tt{font-weight:600;word-break:break-word}.bd small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-done .tt{text-decoration:line-through;color:var(--muted);font-weight:500}.k-done{opacity:.8}
.sb{flex:none;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.sb-todo{background:var(--todo-bg);color:var(--todo)}.sb-doing{background:var(--tint);color:var(--accent)}.sb-done{background:var(--ok-bg);color:var(--ok)}
.none{margin:0;padding:18px;border-radius:18px;border:1px dashed var(--line);text-align:center;color:var(--muted);font-size:15px}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
.tab{flex:1;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);transition:color .25s}
.tab .ico{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background .28s var(--ease),transform .2s var(--ease)}
.tab:active .ico{transform:scale(.92)}.tab[aria-selected=true]{color:var(--accent)}.tab[aria-selected=true] .ico{background:var(--tint)}
.fab{position:absolute;z-index:11;right:20px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px);display:grid;place-items:center;width:58px;height:58px;border-radius:50%;color:#fff;background:linear-gradient(150deg,#3556E8,#6481FF);box-shadow:0 10px 22px rgba(53,86,232,.38),0 2px 6px rgba(18,21,28,.14);transition:transform .25s var(--ease)}
.fab .g{width:26px;height:26px;stroke-width:2.2;transition:transform .35s var(--ease)}.fab:active{transform:scale(.92)}
.app.sheet-open .fab .g{transform:rotate(135deg)}
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,12,18,.42);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
.app.sheet-open .scrim{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);box-shadow:0 -12px 40px rgba(0,0,0,.2);transform:translateY(105%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
.app.sheet-open .sheet{transform:none;visibility:visible;transition-delay:0s}
.grab{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:var(--line)}
.sheet h3{font-size:22px;letter-spacing:-.01em;margin:0 0 14px}
.sheet label{display:block;margin:12px 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{resize:none;min-height:72px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tm{display:flex;align-items:center;gap:4px}.tm select{padding:12px 6px}
.qrow{display:flex;gap:8px}.qrow input{flex:1}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:block;width:100%;height:50px;margin-top:10px;border-radius:15px;font-weight:600;font-size:17px;color:#fff;background:var(--accent);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}.btn.sm{width:auto;height:auto;margin:0;padding:0 18px;font-size:16px;border-radius:12px}
.btn.ghost{background:var(--bg);color:var(--ink)}.btn.danger{background:var(--late-bg);color:var(--late)}
.two2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.msg{margin-top:10px;font-size:14px}.msg .m{padding:10px 12px;border-radius:12px;border:1px solid;line-height:1.45}
.msg .m.err{background:var(--late-bg);border-color:var(--late);color:var(--late)}.msg .m.warn{background:var(--tint);border-color:var(--accent);color:var(--ink)}
.msg .m .btn{display:inline-block;width:auto;height:auto;margin:8px 8px 0 0;padding:7px 14px;font-size:14px;border-radius:10px}
.msg .m .btn.ghost{background:var(--surface)}
.toast{position:absolute;z-index:60;left:16px;right:16px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 92px);padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;transition-delay:0s!important}}
.chips{display:none}
.ch{display:block;font-style:normal;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ch-todo{background:var(--todo-bg);color:var(--todo)}.ch-doing{background:var(--tint);color:var(--accent)}.ch-done{background:var(--ok-bg);color:var(--ok)}
@media(min-width:900px){
.app{max-width:1200px;box-shadow:none}
.sheet{left:24px;top:16px;bottom:16px;right:auto;width:340px;max-height:none;border-radius:22px;box-shadow:var(--shadow);transform:none!important;visibility:visible!important;z-index:5;transition:none}
.grab,.scrim,.fab{display:none}
.tabbar{left:388px;right:auto;top:72px;bottom:auto;width:380px;padding:4px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px;height:40px;border-radius:12px;font-size:14px}
.tab .ico{width:auto;height:auto;background:none!important}.tab[aria-selected=true]{background:var(--tint)}
.page{inset:136px 24px 0 388px;padding:8px 4px 48px}
.toast{left:auto;right:24px;bottom:24px;width:380px}
.cal{padding:12px}.days{gap:6px}.wk span{font-size:13px}
.dy{height:auto;min-height:112px;justify-items:stretch;align-content:start;gap:6px;padding:8px;text-align:left;background:var(--bg);border-radius:14px}
.dy b{width:28px;height:28px;font-size:14px;justify-self:start}.dy .dots{display:none}
.chips{display:grid;gap:3px;width:100%}.chips small{padding-left:4px}
.dy.sel{background:var(--tint)}.dy.out{opacity:.4}
.strip{display:none}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.wkgrid .day{margin:0;padding:12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.wkgrid .item{display:grid;gap:4px;padding:10px;box-shadow:none;background:var(--bg)}
.wkgrid .tm2{display:flex;gap:4px;align-items:baseline;min-width:0}.wkgrid .tm2 small::before{content:"–\00a0"}
.wkgrid .sb{justify-self:start}.wkgrid .none{padding:12px;font-size:13px}
#p2 .stack{max-width:760px}
}
.qbar{position:absolute;left:0;right:0;top:0;z-index:12;display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.qbar input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.qadd,.qxl{flex:none;height:44px;border-radius:14px;font-weight:600;transition:transform .18s var(--ease)}
.qadd{padding:0 18px;background:var(--accent);color:#fff}
.qxl{display:grid;place-items:center;width:44px;background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.qadd:active,.qxl:active{transform:scale(.94)}
.qmsg{position:absolute;z-index:13;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 64px);margin:0}
.qmsg .m{box-shadow:0 10px 30px rgba(0,0,0,.18);background:var(--surface)}.qmsg .m.err{background:var(--late-bg)}.qmsg .m.warn{background:var(--tint)}
.xlsheet{position:absolute;left:0;right:0;bottom:0;z-index:42;max-height:92dvh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);box-shadow:0 -12px 40px rgba(0,0,0,.2);transform:translateY(105%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
.app.xl-open .xlsheet{transform:none;visibility:visible;transition-delay:0s}
.app.xl-open .scrim{opacity:1;visibility:visible;transition-delay:0s}
.xlsheet h3{font-size:22px;letter-spacing:-.01em;margin:0 0 8px}
.xlsheet label{display:block;margin:10px 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.xlsum{margin:0 0 4px;font-size:15px}.xlsum small{display:block;margin-top:6px;line-height:1.55}
.xt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.xhint{font-size:13px;color:var(--muted);margin:8px 0 0}
.xlist{display:grid;gap:8px;max-height:40dvh;overflow-y:auto;margin:12px 0 4px}
.xlsheet .xr{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:14px;background:var(--bg);color:var(--ink);font-size:15px;font-weight:400}
.xr input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.xd{display:grid;min-width:96px}.xd b{font-size:14px}.xtx{display:grid;gap:2px;min-width:0}
.tag{display:inline-block;margin:3px 6px 0 0;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--late-bg);color:var(--late)}.tag.est{background:var(--tint);color:var(--accent)}
.btn:disabled{opacity:.45}
@media(min-width:900px){
.qbar{left:388px;right:24px;top:16px;padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.qmsg{left:388px;right:24px;top:68px}
.xlsheet{left:50%;right:auto;bottom:auto;top:50%;width:680px;max-height:86dvh;border-radius:24px;transform:translate(-50%,-44%);opacity:0;transition:transform .35s var(--ease),opacity .25s var(--ease),visibility 0s .35s}
.app.xl-open .xlsheet{transform:translate(-50%,-50%);opacity:1}
.app.xl-open .scrim{display:block}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
<symbol id="i-week" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M9.5 5v15M14.5 5v15"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11"/><g fill="currentColor" stroke="none"><circle cx="4.8" cy="7" r="1.3"/><circle cx="4.8" cy="12" r="1.3"/><circle cx="4.8" cy="17" r="1.3"/></g></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-xl" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5M9.5 12.5l4 4m0-4-4 4"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-r" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</defs></svg>
<div class="app" id="app">
  <div class="qbar">
    <input id="qInput" maxlength="160" autocomplete="off" enterkeyhint="done" aria-label="Thêm nhanh" placeholder="Thêm nhanh: gõ ngày, giờ và tên việc">
    <button class="qadd" id="qBtn" type="button">Thêm</button>
    <button class="qxl" id="qXl" type="button" aria-label="Nhập lịch từ file Excel" title="Nhập lịch từ file Excel"><svg class="g" aria-hidden="true"><use href="#i-xl"/></svg></button>
  </div>
  <div class="msg qmsg" id="qMsg" role="status" aria-live="polite"></div>
  <input type="file" id="xlFile" accept=".xlsx,.xls,.xlsm,.csv" hidden>
  <main class="page on" id="p0" role="tabpanel" aria-labelledby="t0"></main>
  <section class="page" id="p1" role="tabpanel" aria-labelledby="t1" inert></section>
  <section class="page" id="p2" role="tabpanel" aria-labelledby="t2" inert></section>
  <nav class="tabbar" role="tablist" aria-label="Điều hướng chính">
    <button class="tab" role="tab" id="t0" aria-controls="p0" aria-selected="true"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-cal"/></svg></span>Tháng</button>
    <button class="tab" role="tab" id="t1" aria-controls="p1" aria-selected="false"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-week"/></svg></span>Tuần</button>
    <button class="tab" role="tab" id="t2" aria-controls="p2" aria-selected="false"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-list"/></svg></span>Danh sách</button>
  </nav>
  <button class="fab" id="fab" aria-label="Thêm lịch trình"><svg class="g" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-label="Lịch trình" inert>
    <div class="grab"></div>
    <h3 id="sTitle">Thêm lịch trình</h3>
    <label for="fTitle">Tên việc</label><input id="fTitle" maxlength="120" autocomplete="off">
    <label for="fDate">Ngày</label><input id="fDate" type="date">
    <div class="two">
      <div><label for="sH">Bắt đầu (24 giờ)</label><div class="tm"><select id="sH" aria-label="Giờ bắt đầu"></select><span>:</span><select id="sM" aria-label="Phút bắt đầu"></select></div></div>
      <div><label for="eH">Kết thúc (24 giờ)</label><div class="tm"><select id="eH" aria-label="Giờ kết thúc"></select><span>:</span><select id="eM" aria-label="Phút kết thúc"></select></div></div>
    </div>
    <label for="fNote">Ghi chú</label><textarea id="fNote" maxlength="500"></textarea>
    <div class="msg" id="err" role="status" aria-live="polite"></div>
    <button class="btn" id="saveBtn" type="button">Thêm lịch trình</button>
    <div class="two2"><button class="btn ghost" id="cancelBtn" type="button">Hủy</button><button class="btn danger" id="delBtn" type="button" hidden>Xóa</button></div>
  </aside>
  <aside class="xlsheet" id="xlSheet" role="dialog" aria-label="Nhập lịch từ Excel" inert>
    <div class="grab"></div>
    <h3>Nhập lịch từ Excel</h3>
    <p class="xlsum" id="xlSum"></p>
    <div id="xlOpts"></div>
    <div class="xlist" id="xlList"></div>
    <div class="two2"><button class="btn ghost" id="xlCancel" type="button">Hủy</button><button class="btn" id="xlOk" type="button">Thêm</button></div>
  </aside>
</div>
<script>
(function(){

  }
  function head(t,nav){
    return '<h1 class="title">'+t+"</h1>"+(nav?'<div class="nv"><button type="button" class="nb" data-nav="prev" aria-label="Trước"><svg class="g" aria-hidden="true"><use href="#i-l"/></svg></button><button type="button" class="nb" data-nav="today">Hôm nay</button><button type="button" class="nb" data-nav="next" aria-label="Sau"><svg class="g" aria-hidden="true"><use href="#i-r"/></svg></button></div>':"");
  }
  function renderMonth(){
    var q=sel.split("-"),y=+q[0],m=+q[1],first=y+"-"+pad(m)+"-01",last=y+"-"+pad(m)+"-"+pad(new Date(y,m,0).getDate()),t=today(),by=group(items),r=by[sel]||[];
    var h=head("Tháng "+m+"/"+y,true)+'<div class="cal"><div class="wk">'+SHORT.map(function(n){return "<span>"+n+"</span>"}).join("")+'</div><div class="days">';
    for(var ws=mondayOf(first);ws<=last;ws=addDays(ws,7))for(var i=0;i<7;i++){
      var d=addDays(ws,i);
      h+='<button type="button" class="dy'+(d<first||d>last?" out":"")+(d===t?" today":"")+(d===sel?" sel":"")+'" data-d="'+d+'" data-sm="1" aria-label="'+wd(d)+" "+fs(d)+", "+(by[d]||[]).length+' việc"><b>'+(+d.slice(8))+"</b>"+dots(by[d])+chips(by[d])+"</button>";
    }
    h+='</div></div><p class="lgd"><span>Sắp tới</span><span class="l2">Đang diễn ra</span><span class="l3">Xong</span></p>'
      +'<h2 class="sec" id="dl">'+wd(sel)+", "+fs(sel)+ex(sel)+"</h2>"+(r.length?'<div class="stack">'+r.map(card).join("")+"</div>":'<p class="none">Không có việc trong ngày này.</p>');
    pages[0].innerHTML=h;
  }
  function renderWeek(){
    var days=weekDays(sel),t=today(),by=group(items);
    var h=head("Tuần "+isoWeek(days[0]),true)+'<p class="range">'+fs(days[0])+" – "+fmt(days[6])+'</p><div class="strip">'
      +days.map(function(d,i){return '<button type="button" class="sd'+(d===sel?" sel":"")+(d===t?" today":"")+'" data-d="'+d+'" data-sc="1" aria-label="'+wd(d)+" "+fs(d)+'"><small>'+SHORT[i]+"</small><b>"+(+d.slice(8))+"</b>"+dots(by[d])+"</button>"}).join("")+"</div>";
    h+='<div class="wkgrid">';
    days.forEach(function(d){
      var r=by[d]||[];
      h+='<section class="day'+(d===sel?" sel":"")+'" id="d-'+d+'"><h3>'+wd(d)+", "+fs(d)+ex(d)+"</h3>"+(r.length?'<div class="stack">'+r.map(card).join("")+"</div>":'<p class="none">Không có việc</p>')+"</section>";
    });
    pages[1].innerHTML=h+"</div>";
  }
  function renderList(){
    var l=sorted(items),h='<h1 class="title">Danh sách</h1>',c="";
    if(!l.length){pages[2].innerHTML=h+'<p class="none">Chưa có lịch trình nào. Bấm nút + để thêm.</p>';return}
    l.forEach(function(x){
      if(x.date!==c){if(c)h+="</div></section>";c=x.date;h+='<section class="day"><h3>'+wd(c)+", "+fmt(c)+ex(c)+'</h3><div class="stack">'}
      h+=card(x);
    });
    pages[2].innerHTML=h+"</div></section>";
  }
  function render(){renderMonth();renderWeek();renderList()}
  function go(i){
    if(i===cur)return;
    var d=i>cur?1:-1,o=pages[cur],n=pages[i];
    n.style.transition="none";n.style.transform="translateX("+d*14+"%)";n.scrollTop=0;void n.offsetWidth;
    n.style.transition="";n.style.transform="";n.classList.add("on");n.inert=false;
    o.classList.remove("on");o.inert=true;o.style.transform="translateX("+(-d*14)+"%)";
    setTimeout(function(){if(!o.classList.contains("on"))o.style.transform=""},380);
    tabs.forEach(function(t,k){t.setAttribute("aria-selected",k===i)});cur=i;
  }
  function nav(k){
    var s=k==="next"?1:-1;
    if(k==="today")sel=today();
    else if(cur===1)sel=addDays(sel,7*s);
    else{var q=sel.split("-"),d=iso(new Date(+q[0],+q[1]-1+s,1));sel=d.slice(0,7)===today().slice(0,7)?today():d}
    render();
  }

  /* ---- Sự kiện ---- */
  tabs.forEach(function(t,k){t.addEventListener("click",function(){go(k)})});
  app.addEventListener("click",function(e){
    var b;
    if(b=e.target.closest("[data-nav]")){nav(b.getAttribute("data-nav"));return}
    if(b=e.target.closest("[data-d]")){
      sel=b.getAttribute("data-d");render();
      var el=b.hasAttribute("data-sc")?$("d-"+sel):b.hasAttribute("data-sm")?$("dl"):null;
      if(el)el.scrollIntoView({behavior:"smooth",block:b.hasAttribute("data-sc")?"start":"nearest"});
      return;
    }
    if(b=e.target.closest("[data-id]"))openSheet(b.getAttribute("data-id"));
  });
  $("fab").addEventListener("click",function(){if(app.classList.contains("sheet-open"))closeSheet();else openSheet(null)});
  $("scrim").addEventListener("click",function(){if(app.classList.contains("xl-open"))closeXl();else closeSheet()});$("cancelBtn").addEventListener("click",closeSheet);
  $("saveBtn").addEventListener("click",submit);$("delBtn").addEventListener("click",remove);
  $("qBtn").addEventListener("click",quickAdd);
  $("qInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();quickAdd()}});
  $("fTitle").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit()}});
  $("qInput").addEventListener("input",function(){pending=null;say("qMsg","","")});
  ["fTitle","fDate","sH","sM","eH","eM"].forEach(function(id){["input","change"].forEach(function(ev){$(id).addEventListener(ev,function(){pending=null;say("err","","")})})});
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-cf]");if(!b||!pending)return;
    var p=pending;pending=null;
    if(b.getAttribute("data-cf")==="yes"){var er=check(p.d,p.editId&&find(p.editId));if(er)say(p.src,"err",esc(er));else apply(p.d,p.editId,p.src)}
    else say(p.src,"","");
  });
  document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(app.classList.contains("xl-open"))closeXl();else if(!wide()&&app.classList.contains("sheet-open"))closeSheet()});
  $("qXl").addEventListener("click",function(){$("xlFile").click()});
  $("xlFile").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";if(f)importFile(f)});
  $("xlCancel").addEventListener("click",closeXl);$("xlOk").addEventListener("click",confirmXl);
  xlEl.addEventListener("change",function(e){if(e.target.hasAttribute("data-i"))updXl();else if(e.target.closest("#xlOpts"))renderXl()});
  xlEl.addEventListener("input",function(e){if(e.target.tagName==="INPUT"&&e.target.closest("#xlOpts"))renderXl()});
  window.addEventListener("storage",function(e){if(e.key===KEY){items=load();render()}});
  setInterval(render,60000);
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
  function layout(){
    if(wide()){if(!app.classList.contains("sheet-open"))openSheet(null);sheetEl.inert=false}
    else{app.classList.remove("sheet-open");sheetEl.inert=true;editingId=null;pending=null}
  }
  if(mq.addEventListener)mq.addEventListener("change",layout);else if(mq.addListener)mq.addListener(layout);
  render();layout();
})();
</script>
</body>
</html>
