name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version

      - name: List files
        run: ls -R .

      - name: Build unsigned IPA
        run: |
          set -e
          BUILD_DIR="$PWD/build"
          DERIVED="$BUILD_DIR/DerivedData"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          xcodebuild -project LichTrinhApp.xcodeproj \
            -scheme LichTrinhApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tail -n 80

          APP_PATH=$(find "$DERIVED" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find "$DERIVED" -type d | head -n 40
            exit 1
          fi
          echo "Found app: $APP_PATH"
          ls -lh "$APP_PATH"

          PAYLOAD="$BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/"

          cd "$BUILD_DIR"
          zip -r LichTrinhApp-unsigned.ipa Payload
          ls -lh LichTrinhApp-unsigned.ipa
          du -h LichTrinhApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LichTrinhApp-unsigned
          path: build/*.ipa
          if-no-files-found: error
