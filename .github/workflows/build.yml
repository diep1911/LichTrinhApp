name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          xcodebuild -version
          swift --version

      - name: Build unsigned IPA (no Xcode project needed)
        run: |
          set -e
          APP_NAME="LichTrinhApp"
          BUNDLE_ID="com.diep.lichtrinh"
          DISPLAY_NAME="Lich Trinh"
          VERSION="1.0"
          BUILD_DIR="$PWD/build"
          APP_DIR="$BUILD_DIR/Payload/${APP_NAME}.app"
          IPA_PATH="$BUILD_DIR/${APP_NAME}-unsigned.ipa"

          echo "Creating .app bundle..."
          rm -rf "$BUILD_DIR"
          mkdir -p "$APP_DIR"

          # Compile Swift source for iOS
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"

          mkdir -p "$BUILD_DIR/obj"
          xcrun swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0 \
            -swift-version 5 \
            -O \
            -whole-module-optimization \
            -parse-as-library \
            -module-name "$APP_NAME" \
            -emit-objc-header-path "$BUILD_DIR/obj/${APP_NAME}-Swift.h" \
            Sources/LichTrinhApp/App.swift \
            -o "$BUILD_DIR/obj/App.o"

          # Link into executable
          xcrun clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=17.0 \
            -fobjc-arc \
            -framework SwiftUI \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            "$BUILD_DIR/obj/App.o" \
            -o "$APP_DIR/$APP_NAME"

          echo "Copying web resources..."
          cp -R Sources/LichTrinhApp/web "$APP_DIR/web"
          ls -R "$APP_DIR/web" | head -n 20

          # Create Info.plist
          cat > "$APP_DIR/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>vi</string>
            <key>CFBundleDisplayName</key><string>${DISPLAY_NAME}</string>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchStoryboardName</key><string></string>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
            <key>UISupportedInterfaceOrientations~ipad</key><array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          PLIST

          echo "App bundle contents:"
          ls -lh "$APP_DIR/"
          echo "---"
          /usr/libexec/PlistBuddy -c "Print" "$APP_DIR/Info.plist" 2>&1 | head -n 30

          echo "Creating IPA..."
          cd "$BUILD_DIR" && zip -r "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"
          du -h "$IPA_PATH"
          echo "IPA ready: $IPA_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: LichTrinhApp-unsigned
          path: build/*.ipa
          if-no-files-found: error
